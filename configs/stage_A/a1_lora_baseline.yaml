# Hidden-state residual adapter (not weight-level LoRA). See stages/stage_A/README.md.
# Keys mirror ResidualConfig / A1Config / TrainingConfig / DomainConfig; unknown keys are rejected.
adapter:
  rank: 16
  activation: identity  # identity | gelu | relu | tanh
  alpha: null           # null → scale 1.0, else alpha / rank
  init_std: null        # null → 1/sqrt(d)
  late_start: null      # null → L//2 + 1
  late_end: null        # null → L - 2
  layers: null          # e.g. [6, 10]: explicit blocks; excludes late_start/late_end
  seed: 0
objective:
  lambda_kl: 0.0        # [team] default, to be swept; KL is always logged
  lambda_wd: 0.0
training:
  model: gpt2
  seq_len: 128
  batch_size: 8
  steps: 200            # per domain, unless the domain sets its own
  learning_rate: 1.0e-3
  eval_batches: 8
  log_every: 10
  seed: 0
  reset_optimizer: true
  output_dir: runs
# Three related legal domains (LexGLUE) trained in order: shared legal language,
# different genres. Every domain is evaluated after every task to produce the
# loss matrix, mean seen-task loss and mean forgetting that later stages are
# compared against. Keep only the first domain for a single-domain run.
domains:
  # Legislation: EU laws and regulations (EUR-Lex).
  - name: eurlex
    dataset: coastalcph/lex_glue
    dataset_config: eurlex
    train_split: "train[:5000]"
    eval_split: "validation[:500]"
    separator: "\n\n"
  # Contracts: provisions from SEC filings (LEDGAR).
  - name: ledgar
    dataset: coastalcph/lex_glue
    dataset_config: ledgar
    train_split: "train[:20000]"
    eval_split: "validation[:2000]"
    separator: "\n\n"
  # Case law: US Supreme Court opinions (long documents, hence fewer rows).
  - name: scotus
    dataset: coastalcph/lex_glue
    dataset_config: scotus
    train_split: "train[:500]"
    eval_split: "validation[:200]"
    separator: "\n\n"
